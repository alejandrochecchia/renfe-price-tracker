# =============================================================================
# 🤖 GitHub Actions Workflow - Recogida diaria de precios Renfe
# =============================================================================
# Este archivo le dice a GitHub que ejecute el script automáticamente cada día.
# 
# Ubicación: .github/workflows/recoger_precios.yml
# =============================================================================

name: 🚄 Recoger precios Renfe

# ¿Cuándo se ejecuta?
on:
  # Automáticamente cada día a las 8:00 y 20:00 (hora España)
  schedule:
    - cron: '0 7 * * *'   # 7:00 UTC = 8:00 España (invierno) / 9:00 (verano)
    - cron: '0 19 * * *'  # 19:00 UTC = 20:00 España (invierno) / 21:00 (verano)
  
  # También se puede ejecutar manualmente desde GitHub
  workflow_dispatch:

# Permisos para poder hacer commits
permissions:
  contents: write

# ¿Qué hace?
jobs:
  recoger-precios:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Descargar el código del repositorio
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4
      
      # 2. Instalar Python
      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      # 3. Instalar dependencias
      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas
          pip install git+https://github.com/belgrano9/renfe_mcp_server.git
      
      # 4. Ejecutar el script de recogida
      - name: 🚄 Recoger precios
        run: python recoger_precios.py
      
      # 5. Guardar los cambios en GitHub
      - name: 💾 Commit y push de datos
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --staged --quiet || git commit -m "📊 Datos actualizados: $(date +'%Y-%m-%d %H:%M')"
          git push
